<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | Day-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap");

      :root {
        --sand-strong: rgba(15, 15, 15, 0.85);
        --brown: #ffffff;
        --muted: #e2d5c5;
        --price: #dfb76c;
        --badge: #c4342f;
        --accent: #e8ddcf;
        --card-border: rgba(255, 255, 255, 0.15);
        --header-height: 72px;
        --button-bg: #faf7f2;
        --button-text: #1f1f1f;
        --button-hover: #9c3b2e;
        --button-hover-text: #faf7f2;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: "Cinzel", "Inter", sans-serif;
        background-color: #1a1510;
        background-image: url("photos/main_bg.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: scroll;
        color: #ffffff;
        padding-top: var(--header-height);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        background: transparent;
      }
      .nav-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: var(--header-height);
        padding: 0 2rem;
        width: 100%;
      }
      .nav-left {
        justify-self: start;
      }
      .nav-right {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .brand-center {
        justify-self: center;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border: none;
        background: transparent;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .brand-text {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fff;
      }
      .nav-link {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
        text-decoration: none;
        font-family: "Cinzel", "Inter", sans-serif;
      }
      .nav-link:hover {
        color: #fff;
      }
      .header-cart {
        position: relative;
        display: inline-flex;
      }
      .header-cart .icon-button {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 1px solid rgba(250, 247, 242, 0.4);
        background: rgba(250, 247, 242, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .header-cart .icon-button img {
        width: 18px;
        height: 18px;
      }
      .hamburger {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        padding: 4px;
      }
      #mobile-menu {
        display: none;
        position: fixed;
        top: var(--header-height);
        left: 0;
        width: 100%;
        height: calc(100vh - var(--header-height));
        background-color: var(--sand-strong);
        padding: 2rem;
        flex-direction: column;
        gap: 1.5rem;
        z-index: 50;
        border-top: 1px solid var(--card-border);
      }
      #mobile-menu.open {
        display: flex;
      }
      #mobile-menu a {
        font-family: "Cinzel", serif;
        font-size: 1.5rem;
        color: #fff;
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 0.1em;
      }
      #mobile-menu .admin-menu-link {
        margin-top: auto;
        padding-top: 1.5rem;
        font-family: "Inter", sans-serif !important;
        font-size: 0.7rem !important;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: none !important;
        color: rgba(255, 255, 255, 0.28) !important;
      }
      #mobile-menu .admin-menu-link:hover {
        color: rgba(255, 255, 255, 0.45) !important;
      }

      .product-main {
        flex: 1;
        width: 100%;
        max-width: 100%;
        padding: 24px 16px 48px;
      }

      #product-status {
        text-align: center;
        padding: 80px 24px;
        font-size: 14px;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      .pd-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
      }

      @media (min-width: 900px) {
        .product-main {
          padding: 32px 40px 64px;
        }
        .pd-layout {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
          gap: 48px;
          align-items: start;
        }
      }

      .pd-media {
        position: relative;
        width: 100%;
      }

      .pd-gallery {
        position: relative;
        width: 100%;
        background: rgba(20, 20, 20, 0.55);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        overflow: hidden;
      }

      .pd-track {
        display: flex;
        width: 100%;
        transition: transform 0.35s ease;
        aspect-ratio: 4 / 5;
        min-height: 320px;
      }

      @media (min-width: 900px) {
        .pd-track {
          aspect-ratio: 1 / 1.05;
          min-height: 560px;
          max-height: 78vh;
        }
      }

      .pd-slide {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.25);
      }

      .pd-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: zoom-in;
        user-select: none;
        -webkit-user-drag: none;
      }

      .pd-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(15, 15, 15, 0.55);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .pd-nav:hover {
        background: rgba(15, 15, 15, 0.85);
      }
      .pd-nav.prev {
        left: 12px;
      }
      .pd-nav.next {
        right: 12px;
      }

      .pd-zoom-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 3;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(15, 15, 15, 0.55);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pd-zoom-btn:hover {
        background: rgba(15, 15, 15, 0.85);
      }

      .pd-thumbs {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }

      .pd-thumb {
        flex: 0 0 auto;
        width: 72px;
        height: 90px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid transparent;
        background: rgba(20, 20, 20, 0.55);
        cursor: pointer;
        padding: 0;
      }
      @media (min-width: 900px) {
        .pd-thumb {
          width: 88px;
          height: 110px;
        }
      }
      .pd-thumb.is-active {
        border-color: var(--price);
      }
      .pd-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .pd-info {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 4px 0 24px;
      }

      .pd-subtitle {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pd-title {
        font-size: clamp(1.4rem, 3vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1.25;
      }

      .price-display {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 10px;
      }
      .price-currency,
      .price-current,
      .price-original {
        color: var(--price);
        font-weight: 700;
      }
      .price-current {
        font-size: 1.35rem;
      }
      .price-original {
        text-decoration: line-through;
        opacity: 0.55;
        font-size: 0.95rem;
      }
      .price-badge {
        background: var(--badge);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 4px 8px;
        border-radius: 999px;
        text-transform: uppercase;
      }
      .pd-unit {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .pd-field-label {
        display: block;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 12px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      }
      .pd-block {
        background: rgba(6, 6, 6, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 16px;
        padding: 16px 16px 18px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      .pd-size-options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .pd-size-btn {
        min-width: 52px;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.16em;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      .pd-size-btn:hover {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.2);
      }
      .pd-size-btn.is-selected {
        background: var(--button-bg);
        color: var(--button-text);
        border-color: var(--button-bg);
      }
      .pd-size-hint {
        margin-top: 8px;
        font-size: 11px;
        color: #ffb4b4;
        letter-spacing: 0.08em;
      }

      .pd-quantity {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .qty-control {
        display: inline-flex;
        align-items: center;
        gap: 0;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 12px;
        overflow: hidden;
        width: fit-content;
        background: rgba(255, 255, 255, 0.08);
      }
      .qty-btn {
        width: 44px;
        height: 44px;
        border: none;
        background: var(--button-bg);
        color: var(--button-text);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .qty-value {
        min-width: 52px;
        text-align: center;
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 0.1em;
        color: #fff;
      }

      .pd-accordion-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        background: transparent;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .pd-accordion-icon {
        transition: transform 0.2s ease;
        font-size: 11px;
      }
      .pd-accordion-header.is-active .pd-accordion-icon {
        transform: rotate(180deg);
      }
      .pd-accordion-panel {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.25s ease;
      }
      .info-details ul {
        list-style: none;
        display: grid;
        gap: 8px;
        padding: 0 0 14px;
      }
      .info-details li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        letter-spacing: 0.06em;
      }
      .info-key {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 10px;
      }
      .info-value {
        color: #fff;
        text-align: right;
      }

      .pd-quick-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .pd-quick-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .pd-quick-item i {
        color: var(--price);
      }

      .size-chart-box {
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 16px;
        background: rgba(6, 6, 6, 0.9);
        overflow: hidden;
        padding: 0;
      }
      .size-chart-title {
        padding: 14px 16px 10px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #fff;
      }
      .size-chart-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .size-chart-table th,
      .size-chart-table td {
        padding: 10px 12px;
        text-align: left;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .size-chart-table thead th {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }
      .size-chart-table tbody th {
        font-weight: 800;
        color: #fff;
        width: 48px;
      }
      .size-chart-table td {
        color: #fff;
        white-space: nowrap;
      }
      @media (max-width: 520px) {
        .size-chart-table {
          font-size: 10px;
        }
        .size-chart-table th,
        .size-chart-table td {
          padding: 8px 8px;
        }
      }

      .pd-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 8px;
      }
      @media (min-width: 520px) {
        .pd-actions {
          grid-template-columns: 1fr 1fr;
        }
        .pd-actions .btn-outline {
          grid-column: 1 / -1;
        }
      }

      .btn-primary,
      .add-btn,
      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      .btn-primary,
      .add-btn {
        background: var(--button-bg);
        color: var(--button-text);
        border: none;
      }
      .btn-primary:hover,
      .add-btn:hover {
        background: var(--button-hover);
        color: var(--button-hover-text);
      }
      .btn-outline {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.45);
      }
      .btn-outline:hover {
        border-color: #fff;
      }

      .back-row {
        max-width: 1400px;
        margin: 0 auto 18px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
      }
      .back-link:hover {
        color: #fff;
      }

      .cart-fab {
        position: fixed;
        right: 18px;
        bottom: 22px;
        z-index: 70;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        border: 1px solid var(--card-border);
        background: rgba(15, 15, 15, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
      .cart-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 20px;
        height: 20px;
        border-radius: 999px;
        background: var(--badge);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%) translateY(20px);
        background: rgba(15, 15, 15, 0.92);
        border: 1px solid var(--card-border);
        color: #fff;
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 90;
      }
      .toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      #img-lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s ease;
        overflow: hidden;
        cursor: zoom-out;
      }
      #img-lightbox.lb-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #img-lightbox img {
        max-width: 92vw;
        max-height: 88vh;
        object-fit: contain;
        transform-origin: center center;
        transition: none;
        cursor: grab;
        user-select: none;
        -webkit-user-drag: none;
      }
      #img-lightbox img.lb-dragging {
        cursor: grabbing;
      }
      #lb-close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        z-index: 2;
      }
      #lb-close:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      #lb-zoom-hint {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        pointer-events: none;
        white-space: nowrap;
      }

      .site-footer {
        background: rgba(10, 10, 10, 0.95);
        border-top: 1px solid var(--card-border);
        width: 100%;
        margin-top: auto;
      }
      .footer-inner {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      .footer-links {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .footer-links a {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        text-decoration: none;
      }
      .footer-links a:hover {
        color: #fff;
      }
      .footer-copy {
        font-family: "Inter", sans-serif;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.28);
      }

      @media (max-width: 768px) {
        :root {
          --header-height: 58px;
        }
        .nav-inner {
          padding: 0 12px;
        }
        .brand-mark {
          width: 32px;
          height: 32px;
        }
        .nav-link {
          font-size: 11px;
          letter-spacing: 0.14em;
        }
        .header-cart .icon-button {
          width: 32px;
          height: 32px;
        }
        .hamburger {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav-inner">
        <div class="nav-left">
          <button class="hamburger" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
        <a href="index.html" class="brand-center" aria-label="Day-1 home">
          <div class="brand-mark">
            <img src="favicon.ico" alt="Day-1 logo" />
          </div>
        </a>
        <div class="nav-right">
          <a class="nav-link" href="shop.html">Shop</a>
          <div class="header-cart">
            <button id="cart-button" class="icon-button" type="button" aria-label="Cart">
              <img src="photos/icons8-bag-100.png" alt="" />
            </button>
            <span id="cart-badge" class="cart-badge">0</span>
          </div>
        </div>
      </nav>
    </header>

    <div id="mobile-menu">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="#cart" onclick="if (window.openGlobalCart) { window.openGlobalCart(); return false; }">Cart</a>
      <a href="admin.html" class="admin-menu-link">Admin</a>
    </div>

    <main class="product-main">
      <div class="back-row">
        <a class="back-link" href="shop.html">
          <i class="fas fa-arrow-left"></i> Back to shop
        </a>
      </div>

      <p id="product-status">Loading product...</p>

      <div id="product-page" class="pd-layout" hidden>
        <div class="pd-media">
          <div class="pd-gallery">
            <button class="pd-nav prev" type="button" data-pd-prev aria-label="Previous image">
              <i class="fas fa-chevron-left"></i>
            </button>
            <button class="pd-nav next" type="button" data-pd-next aria-label="Next image">
              <i class="fas fa-chevron-right"></i>
            </button>
            <button
              class="pd-zoom-btn"
              id="pd-zoom-btn"
              type="button"
              title="View full image"
              aria-label="Open full image viewer"
            >
              <i class="fas fa-expand-alt"></i>
            </button>
            <div class="pd-track" id="pd-track"></div>
          </div>
          <div class="pd-thumbs" id="pd-thumbs"></div>
        </div>

        <div class="pd-info">
          <h1 id="pd-title" class="pd-title"></h1>

          <div class="price-display">
            <span class="price-currency">BDT</span>
            <span id="pd-offer" class="price-original"></span>
            <span id="pd-price" class="price-current"></span>
            <span id="pd-badge" class="price-badge"></span>
          </div>
          <p id="pd-unit" class="pd-unit"></p>

          <div class="pd-block">
            <span class="pd-field-label">Size</span>
            <div class="pd-size-options" id="pd-size-options"></div>
            <p class="pd-size-hint" id="pd-size-hint" hidden></p>
          </div>

          <div class="pd-block pd-quantity">
            <span class="pd-field-label">Quantity</span>
            <div class="qty-control">
              <button id="pd-qty-minus" class="qty-btn" type="button">-</button>
              <span id="pd-qty-value" class="qty-value">1</span>
              <button id="pd-qty-plus" class="qty-btn" type="button">+</button>
            </div>
          </div>

          <div class="size-chart-box pd-block" aria-label="Size chart">
            <p class="size-chart-title">Size chart</p>
            <div style="overflow-x: auto;">
              <table class="size-chart-table">
                <thead id="pd-chart-head"></thead>
                <tbody id="pd-chart-body"></tbody>
              </table>
            </div>
          </div>

          <div class="pd-actions">
            <button id="pd-add" class="add-btn" type="button">
              Add to cart <i class="fas fa-cart-shopping text-xs"></i>
            </button>
            <button id="pd-buy" class="btn-primary" type="button">
              Buy now <i class="fas fa-arrow-right text-xs"></i>
            </button>
            <a class="btn-outline" href="shop.html">Continue shopping</a>
          </div>
        </div>
      </div>
    </main>

    <div id="img-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button id="lb-close" aria-label="Close image viewer">
        <i class="fas fa-times"></i>
      </button>
      <img src="" alt="Full size product image" draggable="false" />
      <p id="lb-zoom-hint">Scroll to zoom · Drag to pan · Double-tap to reset</p>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
        <p class="footer-copy">&copy; 2026 Day-1. All rights reserved.</p>
      </div>
    </footer>

    <script type="module" src="product.js"></script>
